<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/html">
    <head>
        <meta charset="UTF-8"/>
        <title>LMU TV livetiming</title>

        <meta name="viewport" content="width=100%, height=100%, initial-scale=1.0"/>
        <link href="../shared/fonts/roboto/roboto.css" rel="stylesheet">

        <link rel="stylesheet" href="css/main.css"/>

        <script src="../shared/libs/jquery.js"></script>
        <script src="../shared/js/websocket.js"></script>
        <script src="../shared/js/state.js"></script>
        <script src="../shared/js/registry.js"></script>

        <script src="js/utils/colors.js"></script>
        <script src="js/utils/standings.js"></script>

        <script src="js/panels/trackmap.js"></script>
        <script src="js/panels/session.js"></script>
        <script src="js/panels/standings.js"></script>

        <script src="js/main.js"></script>
        <script src="js/utils/mock.js"></script>
    </head>
    <body>
        <header id="session-info">
            <div class="info-block">
                <span class="info-label">Track</span>
                <span class="info-value" id="track-name"></span>
            </div>
            <div class="info-block info-center">
                <span class="info-label">Flags</span>
                <div id="track-status"></div>
            </div>
            <div class="info-block info-center">
                <span class="info-label" id="session-name"></span>
                <span class="info-value info-time" id="session-time"></span>
            </div>
            <div class="info-block info-center">
                <span class="info-label">Forecast</span>
                <div class="weather-forecast" id="weather-forecast"></div>
            </div>
            <div class="info-block info-right">
                <span class="info-label">Weather</span>
                <span class="info-sub" id="weather-value"></span>
            </div>
        </header>
        <div id="standings-options">
            <label><input type="checkbox" id="show-track-map" checked/> Track map</label>
            <label class="map-scale"><span>Map scale</span><input type="range" id="track-map-scale" min="50" max="300" value="100" step="1"/><span class="map-scale-value" id="track-map-scale-value">100%</span></label>
            <label><input type="checkbox" id="split-by-class" checked/> Split by vehicle class</label>
            <label><input type="checkbox" id="light-theme"/> Light theme</label>
        </div>
        <div id="content-grid">
            <div id="live-timing-standings">
            </div>
            <canvas id="track-map-panel" aria-label="Track map"></canvas>
        </div>
    </body>
</html>
