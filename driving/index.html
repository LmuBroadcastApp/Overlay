<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/html">
    <head>
        <meta charset="UTF-8"/>
        <title>LMU Driver Overlay</title>

        <meta name="viewport" content="width=100%, height=100%, initial-scale=1.0"/>
        <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap"  rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/gh/mshaugh/nerdfont-webfonts@v3.3.0/build/firacode-nerd-font.css" rel="stylesheet">

        <link rel="stylesheet" href="styles/css/telemetry.css"/>
        <link rel="stylesheet" href="styles/css/weather.css"/>
        <link rel="stylesheet" href="styles/css/common.css"/>
        <link rel="stylesheet" href="styles/css/damage.css"/>

        <script src="styles/js/utils/websocket.js"></script>
        <script src="styles/js/utils/network.js"></script>
        <script src="styles/js/utils/jquery.js"></script>
        <script src="styles/js/utils/chart.js"></script>

        <script src="styles/js/utils/registry.js"></script>
        <script src="styles/js/utils/state.js"></script>

        <script src="styles/js/panels/PitStopEstimation.js"></script>
        <script src="styles/js/panels/TelemetryChart.js"></script>
        <script src="styles/js/panels/Weather.js"></script>
        <script src="styles/js/panels/Damange.js"></script>

        <script src="styles/js/main.js"></script>
    </head>
    <body>
        <canvas id="telemetry-input-chart"></canvas>

        <div id="damage-panel">
            <div class="pit-stop-header">DAMAGE</div>
            <div class="pit-stop-row"><span class="pit-stop-label">Aero</span><span class="pit-stop-value damage-panel-aero">10%</span></div>
            <div class="pit-stop-row"><span class="pit-stop-label">Body</span><span class="pit-stop-value damage-panel-body">10%</span></div>
            <div class="pit-stop-row"><span class="pit-stop-label">Susp</span><span class="pit-stop-value damage-panel-susp">10%</span></div>
        </div>

        <div id="pit-stop-estimation">
            <div class="pit-stop-header">PIT STOP ESTIMATION</div>
            <div class="pit-stop-row"><span class="pit-stop-label">Driver swap</span><span class="pit-stop-value pit-stop-estimation-driver-swap">0.0s</span></div>
            <div class="pit-stop-row"><span class="pit-stop-label">Penalties</span><span class="pit-stop-value pit-stop-estimation-penalties">0.0s</span></div>
            <div class="pit-stop-row"><span class="pit-stop-label">Damage</span><span class="pit-stop-value pit-stop-estimation-damage">0.0s</span></div>
            <div class="pit-stop-row"><span class="pit-stop-label">Tires</span><span class="pit-stop-value pit-stop-estimation-tires">0.0s</span></div>
            <div class="pit-stop-row"><span class="pit-stop-label">Fuel</span><span class="pit-stop-value pit-stop-estimation-fuel">0.0s</span></div>
            <div class="pit-stop-row"><span class="pit-stop-label">VE</span><span class="pit-stop-value pit-stop-estimation-ve">0.0s</span></div>
            <div class="pit-stop-divider"></div>
            <div class="pit-stop-row"><span class="pit-stop-label">Total</span><span class="pit-stop-value pit-stop-total-value pit-stop-estimation-total">0.0s</span></div>
        </div>

        <div id="weather-panel">
            <table class="weather-panel-forecast">
                <tr class="weather-panel-forecast-header">
                </tr>
                <tr class="weather-panel-forecast-body">
                </tr>
            </table>
            <table class="weather-panel-conditions">
                <tr>
                    <th class="weather-panel-track-header">TRACK</th>
                    <th class="weather-panel-temp-header">TEMPERATURE</th>
                    <th class="weather-panel-wind-header">WIND</th>
                </tr>
                <tr>
                    <td class="weather-panel-track-body"></td>
                    <td class="weather-panel-temp-body"></td>
                    <td class="weather-panel-wind-body"></td>
                </tr>
            </table>
        </div>
    </body>
</html>
