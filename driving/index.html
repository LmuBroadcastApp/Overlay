<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <title>LMU Driver Overlay</title>

        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link href="../shared/fonts/titillium/titillium.css" rel="stylesheet">
        <link href="../shared/fonts/firacode/firacode-nerd-font.css" rel="stylesheet">

        <link rel="stylesheet" href="css/common.css"/>
        <link rel="stylesheet" href="css/telemetry.css"/>
        <link rel="stylesheet" href="css/laptime.css"/>
        <link rel="stylesheet" href="css/weather.css"/>
        <link rel="stylesheet" href="css/damage.css"/>
        <link rel="stylesheet" href="css/map.css"/>

        <script src="../shared/js/websocket.js"></script>

        <script src="../shared/js/registry.js"></script>
        <script src="../shared/js/state.js"></script>
        <script src="js/utils/standings.js"></script>
        <script src="js/utils/draggable.js"></script>

        <script src="js/panels/pit_stop_estimation.js"></script>
        <script src="js/panels/laptime_log.js"></script>
        <script src="js/panels/telemetry.js"></script>
        <script src="js/panels/weather.js"></script>
        <script src="js/panels/damage.js"></script>
        <script src="js/panels/map.js"></script>

        <script src="js/main.js"></script>
        <!-- mock.js must load after main.js so panels are created before mock state is pushed -->
        <script src="js/utils/mock.js"></script>
    </head>
    <body>
        <canvas id="telemetry-input-chart" class="overlay-panel"></canvas>
        <canvas id="track-map-panel"></canvas>

        <div id="damage-panel" class="overlay-panel">
            <div class="pit-stop-header">DAMAGE</div>
            <div class="pit-stop-row"><span class="pit-stop-label">Aero</span><span class="pit-stop-value damage-ok damage-panel-aero">0.0%</span></div>
            <div class="pit-stop-row"><span class="pit-stop-label">Body</span><span class="pit-stop-value damage-ok damage-panel-body">0.0%</span></div>
            <div class="pit-stop-row"><span class="pit-stop-label">Susp</span><span class="pit-stop-value damage-ok damage-panel-susp">0.0%</span></div>
        </div>

        <div id="pit-stop-estimation" class="overlay-panel">
            <div class="pit-stop-header">PIT STOP ESTIMATION</div>
            <div class="pit-stop-row"><span class="pit-stop-label">Driver swap</span><span class="pit-stop-value pit-stop-estimation-driver-swap">0.0s</span></div>
            <div class="pit-stop-row"><span class="pit-stop-label">Penalties</span><span class="pit-stop-value pit-stop-estimation-penalties">0.0s</span></div>
            <div class="pit-stop-row"><span class="pit-stop-label">Damage</span><span class="pit-stop-value pit-stop-estimation-damage">0.0s</span></div>
            <div class="pit-stop-row"><span class="pit-stop-label">Tires</span><span class="pit-stop-value pit-stop-estimation-tires">0.0s</span></div>
            <div class="pit-stop-row"><span class="pit-stop-label">Fuel</span><span class="pit-stop-value pit-stop-estimation-fuel">0.0s</span></div>
            <div class="pit-stop-row"><span class="pit-stop-label">VE</span><span class="pit-stop-value pit-stop-estimation-ve">0.0s</span></div>
            <div class="pit-stop-divider"></div>
            <div class="pit-stop-row"><span class="pit-stop-label">Total</span><span class="pit-stop-value pit-stop-total-value pit-stop-estimation-total">0.0s</span></div>
        </div>

        <div id="laptime-log" class="overlay-panel">
            <div class="pit-stop-header">LAPTIME LOG</div>
            <canvas class="laptime-log-chart" width="272" height="150"></canvas>
            <div class="laptime-log-header">
                <span class="laptime-log-lap">Lap</span>
                <span class="laptime-log-time">Time</span>
                <span class="laptime-log-delta">Delta</span>
            </div>
            <div class="laptime-log-rows"></div>
        </div>

        <div id="weather-panel" class="overlay-panel">
            <table class="weather-panel-forecast">
                <tr class="weather-panel-forecast-header">
                </tr>
                <tr class="weather-panel-forecast-body">
                </tr>
            </table>
            <table class="weather-panel-conditions">
                <tr>
                    <th class="weather-panel-track-header">GRIP</th>
                    <th class="weather-panel-track-header">RAIN</th>
                    <th class="weather-panel-temp-header">TEMPERATURE</th>
                    <th class="weather-panel-wind-header">WIND</th>
                </tr>
                <tr>
                    <td class="weather-panel-track-body"></td>
                    <td class="weather-panel-rain-body"></td>
                    <td class="weather-panel-temp-body"></td>
                    <td class="weather-panel-wind-body"></td>
                </tr>
            </table>
        </div>
    </body>
</html>
